extend type Query {
  party(id: ID!): Party
  parties: [Party!]!
  nextParty: Party
}

extend type Mutation {
  setAttendance(partyId: ID!, userId: ID, dates: [Date!]!): Party!
  removeAttendance(partyId: ID!, userId: ID): Party!
  requestRoom(partyId: ID!): Attending
  recindRoom(partyId: ID!): Attending
  grantRoom(attendingId: ID!): Attending
  denyRoom(attendingId: ID!): Attending

  updateParty(input: PartyInput!): Party!

  updateAttending(partyId: ID!, input: UpdateAttendingInput!): Attending!

  addPicture(input: PictureInput!): Picture!

  checkIn(userId: ID!): Attending
  checkOut(userId: ID!): Attending

  updatePaidDues(attendingId: ID!, paidDues: Float!): Attending

  createPayPalOrder: ID!
  capturePayPalOrder(orderId: ID!): Attending

  sendPaymentNotification(userId: ID!): Attending!
  sendPaymentNotificationToAll: [Attending!]!
}

type Party @rbac {
  id: ID!
  startDate: Date!
  endDate: Date!
  tentative: Boolean!
  latitude: Float!
  longitude: Float!
  location: String!
  locationWidgetSrc: String
  roomsAvailable: Int!
  rentalCosts: Float!
  feedingCosts: Float!
  attendings: [Attending!]!
  attending(userId: ID): Attending
  pictures: [Picture!]!
  seatsAvailable: Int!
  registrationDeadline: Date
  payday: Date
  costPerDay: Float!
  rentalCostPerDay: Float!
  finalCostPerDay: Float
  finalFeedingCostPerDay: Float
  billableDaysCount: Int!
  dayBreakdown: [PartyDayBreakdown!]!
  paidDues: Float
  seatPlan: SeatPlan!
}

type PartyDayBreakdown {
  date: String!
  isBillable: Boolean!
  rentalCost: Float!
  participantsCount: Int!
  costPerParticipant: Float!
}
enum SeatPlanElementType {
  TABLE
  ENTRANCE
  EXIT
  DOOR
  COLUMN
  FRIDGE
  COUCH
  WC
}

type SeatPlanElement {
  id: ID!
  type: SeatPlanElementType!
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  label: String
}
type SeatPlan {
  width: Float!
  height: Float!
  elements: [SeatPlanElement!]!
}

type Picture {
  id: ID!
  url: String!
  party: Party!
  tags: [PictureTag!]!
  meta: PictureMeta!
}

type PictureMeta {
  width: Int!
  height: Int!
  latitude: Float
  longitude: Float
  altitude: Float
  takeAt: DateTime
}

type PictureTag {
  id: ID!
  user: User!
  picture: Picture!
  boundingBox: BoundingBox!
}

scalar BoundingBox

input PartyInput {
  id: ID
  startDate: Date!
  endDate: Date!
  location: String!
  locationWidgetSrc: String
  roomsAvailable: Int!
  tentative: Boolean
  rentalCosts: Float
  feedingCosts: Float
  finalCostPerDay: Float
  finalFeedingCostPerDay: Float
  registrationDeadline: Date
  payday: Date
}

input PictureInput {
  name: String!
  partyId: ID!
  file: File!
  tags: [PictureTagInput!]
}

input PictureTagInput {
  userId: ID!
  boundingBox: BoundingBox!
}

type Attending {
  id: ID!
  party: Party!
  dates: [Date!]!
  room: RoomStatus
  applicationDate: Date!
  rentDues: Float
  feedingDues: Float
  totalDues: Float
  paidDues: Float!
  checkIn: DateTime
  checkOut: DateTime
  notificationSent: DateTime
  withPc: Boolean
  seatNumber: String
}

input UpdateAttendingInput {
  withPc: Boolean
  seatNumber: String
}

enum RoomStatus {
  REQUESTED
  GRANTED
}
