enum EventType {
  STANDARD
  FOOD
}

enum EventPricingMode {
  PER_SERVING
  FLAT
  PARTY_DONATION
}

type EventParticipant {
  user: User!
  servings: Int!
}

extend type Mutation {
  planEvent(input: EventInput!): Event!
  participateInEvent(id: ID!, userId: ID, servings: Int): Event!
  updateEventServings(id: ID!, servings: Int!, userId: ID): Event!
  leaveEvent(id: ID!, userId: ID): Event!
}

extend type Party {
  events: [Event!]!
}

type Event {
  id: ID!
  name: String!
  party: Party!
  date: Date
  startTime: String
  endTime: String
  organizer: User!
  participants: [User!]!
  description: String
  image: String!
  eventType: EventType!
  pricingMode: EventPricingMode
  price: Float
  servingsUnit: String
  participantServings: [EventParticipant!]!
  totalServings: Int!
}

input EventInput {
  id: ID
  name: String!
  partyId: ID!
  date: Date
  startTime: String
  endTime: String
  description: String
  image: File
  eventType: EventType
  pricingMode: EventPricingMode
  price: Float
  servingsUnit: String
}

